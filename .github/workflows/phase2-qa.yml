name: Phase 2 QA

on:
  push:
    branches: ["phase2-qa"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./qa.db
          SCHEDULED_JOB_KEY: qa-test-key
        run: pytest -q

  scheduler-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 2 migration shape
        run: |
          test -s supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand-os-daily-discovery" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand-os-calendar-generation" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand-os-daily-retention" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand_os_render_url" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "brand_os_job_key" supabase/migrations/20260925_phase2_scheduler.sql
          grep -q "X-Brand-OS-Job-Key" supabase/migrations/20260925_phase2_scheduler.sql
          test -s supabase/migrations/20260925_phase2_scheduler_rollback.sql
