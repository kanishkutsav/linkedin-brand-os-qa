name: Phase 4 QA

on:
  push:
    branches: ["phase3-qa"]
  pull_request:
    branches: ["main"]

jobs:
  read-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run Phase 4 contract tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./qa.db
        run: pytest -q tests/test_phase4_qa.py
  phase-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run Phase 2 + Phase 3 regression suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./qa.db
          SCHEDULED_JOB_KEY: qa-test-key
        run: pytest -q tests/test_scheduled_job_boundary.py tests/test_phase2_qa.py tests/test_phase3_qa.py
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase read function
        run: deno check supabase/functions/read-api/index.ts

  runtime-3-14:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile under Python 3.14
        run: python -m compileall -q app tests

# Phase 4 QA intentionally does not deploy or mutate production infrastructure.
