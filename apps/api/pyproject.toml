[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-brand-os-api"
version = "0.1.0"
description = "HITL-first AI LinkedIn Personal Brand OS API"
requires-python = ">=3.14,<3.15"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
